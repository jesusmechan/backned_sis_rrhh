# Stack local de observabilidad (Prometheus + Grafana).
# La API Spring Boot sigue corriendo fuera (mvn spring-boot:run).
#
# Uso:
#   docker compose -f docker-compose.observability.yml up -d
#   docker compose -f docker-compose.observability.yml down
#
# URLs:
#   Prometheus  http://localhost:9090
#   Grafana     http://localhost:3000  (admin / admin)

services:
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: rrhh-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    extra_hosts:
      # Permite scrapear la API en el host (Windows/macOS Docker Desktop)
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.1
    container_name: rrhh-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: http://localhost:3000
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:
