# Ejemplo: scrapear la API desplegada en Render desde Prometheus local.
# Copia a prometheus.yml (o monta este archivo) y ajusta el hostname.
#
#   cp observability/prometheus-prod.example.yml observability/prometheus.yml
#   docker compose -f docker-compose.observability.yml up -d --force-recreate prometheus

global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: rrhh-api-local
    metrics_path: /actuator/prometheus
    scrape_interval: 10s
    static_configs:
      - targets: ["host.docker.internal:8080"]
        labels:
          env: local
          app: rrhh-api

  - job_name: rrhh-api-prod
    scheme: https
    metrics_path: /actuator/prometheus
    scrape_interval: 30s
    scrape_timeout: 20s
    static_configs:
      # Sin esquema ni path: solo host
      - targets: ["rrhh-api-2bgd.onrender.com"]
        labels:
          env: production
          app: rrhh-api
