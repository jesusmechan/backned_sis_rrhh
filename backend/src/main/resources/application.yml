server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

spring:
  application:
    name: rrhh-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/rrhh_andina}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: America/Lima
        type:
          preferred_enum_jdbc_type: NAMED_ENUM
    show-sql: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

app:
  jwt:
    # Obligatorio vía JWT_SECRET (backend/.env). Mínimo 32 caracteres. Sin default de código.
    secret: ${JWT_SECRET}
    access-expiration-ms: 900000
    refresh-expiration-ms: 604800000
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:*,http://127.0.0.1:*}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    # Cupo por IP y minuto (ventana fija). Auth es más estricto (login/refresh).
    api-per-minute: ${RATE_LIMIT_API:120}
    auth-per-minute: ${RATE_LIMIT_AUTH:20}
  idempotency:
    enabled: ${IDEMPOTENCY_ENABLED:true}
    # Ventana para reutilizar la misma respuesta ante reintentos con Idempotency-Key.
    ttl-hours: ${IDEMPOTENCY_TTL_HOURS:24}
